docs: |-
  # List Audit Entries — All Modules
  Uses the consolidated Atlas.API audit endpoint and routes by `entityTypeId`.

  Example value above targets `Party.Person`:
  `00000000-0000-0000-0004-000000000001`

  Other entity type IDs can be discovered from:
  `GET /bff/v1/platform/entity-types/lookup`
