docs: |-
  # List Audit Entries — All Filters
  Returns all audit entries for a given entity type within the current tenant.
  All parameters except `entityTypeId` are optional and can be combined freely.
  ---

  ## Parameters
  | Parameter    | Type     | Required | Description                                                        |
  |--------------|----------|----------|--------------------------------------------------------------------|
  | entityTypeId | UUID     | yes      | Entity type ID — get it from `GET /bff/v1/platform/entity-types/lookup` |
  | action       | string   | no       | Filter by action: `Added`, `Modified`, `Deleted`                   |
  | from         | ISO 8601 | no       | Lower bound for `occurredAtUtc`                                    |
  | to           | ISO 8601 | no       | Upper bound for `occurredAtUtc`                                    |
  | entityId     | string   | no       | Filter by the ID of the audited record                             |
