info:
  name: Entries-ListByEntityTypeAndAction
  type: http
  seq: 3

http:
  method: get
  url: "{{bff_api_prefix}}/bff/v1/platform/audit/entries?entityTypeId=GUID-AQUI&action=Added"
  params:
    - name: entityTypeId
      value: GUID-AQUI
      type: query
    - name: action
      value: Added
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Action values
  | Value      | Meaning                 |
  |------------|-------------------------|
  | `Added`    | Record was created      |
  | `Modified` | Record was updated      |
  | `Deleted`  | Record was soft-deleted |
