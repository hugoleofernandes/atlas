info:
  name: Persons-Deactivate
  type: http
  seq: 4

http:
  method: patch
  url: "{{bff_api_prefix}}/bff/v1/party/persons/%7Bid%7D/deactivate"
  headers:
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
