info:
  name: Persons-Update
  type: http
  seq: 3

http:
  method: put
  url: "{{bff_api_prefix}}/bff/v1/party/persons/%7Bid%7D"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  body:
    type: json
    data: |-
      {
          "id": "{id}",
          "firstName": "Maria",
          "lastName": "Silva",
          "middleName": "Souza",
          "birthDate": "1990-05-12",
          "gender": "Female",
          "contacts": [
            {
              "type": "Email",
              "value": "maria.souza@example.com",
              "isPrimary": true
            },
            {
              "type": "Mobile",
              "value": "+5511988887777",
              "isPrimary": true
            }
          ],
          "classifications": [
            {
              "type": "Staff",
              "since": "2024-01-01",
              "until": null
            }
          ],
          "notes": null
        }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
