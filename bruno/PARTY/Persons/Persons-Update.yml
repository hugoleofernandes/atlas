info:
  name: Persons-Update
  type: http
  seq: 3

http:
  method: put
  url: "{{bff_api_prefix}}/bff/v1/party/persons/%7Bid%7D"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  body:
    type: json
    data: |-
      {
          "id": "{id}",
          "firstName": "Maria",
          "lastName": "Silva",
          "middleName": "Souza",
          "birthDate": "1990-05-12",
          "gender": "Female"
        }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
